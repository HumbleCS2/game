<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Momonga Plinko</title>
  <style>
    :root { --ink: #463452; --cream: #fffbff; --green: #ded1ff; --dark: #8769a6; --pink: #f2aac8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(rgba(224,205,250,.72),rgba(202,181,237,.78)), url('momonga-background.jpg') center / cover fixed; color:var(--ink); font-family:ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; }
    .shell { width:min(96vw, 940px); display:flex; align-items:flex-start; gap:18px; }
    .game { flex:1; min-width:0; padding:22px; border:5px solid var(--ink); border-radius:30px; background:var(--cream); box-shadow:10px 10px 0 rgba(38,51,34,.25); }
    .scoreboard { width:245px; padding:18px 14px; border:4px solid var(--ink); border-radius:24px; background:#e8dcff; box-shadow:7px 7px 0 rgba(70,52,82,.2); text-align:center; }
    .scoreboard h2 { margin:0 0 12px; font-size:1.05rem; line-height:1.1; }
    .leaderboard { margin:0; padding:8px 8px 8px 30px; min-height:144px; border:3px solid var(--ink); border-radius:16px; background:var(--cream); text-align:left; font-size:.8rem; font-weight:800; }
    .leaderboard li { display:flex; justify-content:space-between; gap:8px; padding:3px 2px; }
    .leaderboard li span { flex:none; }
    .reset-scores { width:100%; margin-top:12px; padding:8px; background:#f7e4ed; font-size:.76rem; }
    .scoreboard p { margin:13px 0 0; font-size:.78rem; font-weight:700; line-height:1.25; }
    header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin: 0 4px 16px; }
    h1 { margin:0; font-size: clamp(1.5rem, 5vw, 2.25rem); letter-spacing: .02em; }
    .score { background:var(--green); border:3px solid var(--ink); border-radius:18px; padding:7px 12px; white-space:nowrap; font-weight:900; }
    .board-wrap { position:relative; overflow:hidden; border:4px solid var(--ink); border-radius:21px; background:linear-gradient(#dff3bd,#a6d88a); }
    canvas { display:block; width:100%; height:auto; aspect-ratio: .757 / 1; }
    .controls { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
    button { cursor:pointer; border:3px solid var(--ink); border-radius:16px; padding:10px 7px; color:var(--ink); background:var(--pink); font:900 .9rem inherit; box-shadow: 0 4px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
    button:hover { transform:translateY(-2px); box-shadow:0 6px 0 var(--ink); } button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); } button:disabled { cursor:not-allowed; filter:grayscale(.35); opacity:.7; transform:none; box-shadow:0 4px 0 var(--ink); }
    .reset { grid-column:1 / -1; background:#f7f0d8; }
    .hint { text-align:center; margin:12px 0 0; font-size:.88rem; font-weight:700; opacity:.75; }
    @media (max-width: 700px) { .shell { display:block; width:min(94vw,600px); } .scoreboard { width:auto; margin-top:14px; } .all-time { display:inline-block; min-width:130px; } }
  </style>
</head>
<body>
  <div class="shell">
  <main class="game">
    <header><h1>Momonga Plinko</h1><div class="score">Round: <span id="score">0</span></div></header>
    <div class="board-wrap"><canvas id="board" width="1120" height="1480" aria-label="Plinko board"></canvas></div>
    <div class="controls">
      <button class="drop" data-drop="1">Drop 1</button><button class="drop" data-drop="5">Drop 5</button><button class="drop" data-drop="10">Drop 10</button>
      <button class="drop" data-drop="25">Drop 25</button><button class="drop" data-drop="50">Drop 50</button><button class="drop" data-drop="100">Drop 100</button>
      <button id="reset" class="reset">New game</button>
    </div>
    <p class="hint"><span id="balls-left">100</span> Momongas left — choose a batch to drop.</p>
  </main>
  <aside class="scoreboard"><h2>All-time<br>top 10</h2><ol id="leaderboard" class="leaderboard"></ol><button id="reset-leaderboard" class="reset-scores">Reset all-time scores</button><p>High scores are saved in this browser.</p></aside>
  </div>
  <script>
    const canvas = document.querySelector('#board'), ctx = canvas.getContext('2d');
    const dropButtons = document.querySelectorAll('.drop'), scoreEl = document.querySelector('#score'), ballsLeftEl = document.querySelector('#balls-left'), resetLeaderboardButton = document.querySelector('#reset-leaderboard');
    // A compact ball leaves generous space between pegs, preventing it from hanging up.
    const W = canvas.width, H = canvas.height, pegR = 9, ballR = 24.75;
    // The payouts rise symmetrically from the 1-point centre slot to 1,024 at each edge.
    const levels = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024];
    const bins = [...levels.slice(1).reverse(), ...levels];
    const binColor = (index) => {
      const distance = Math.abs(index - (bins.length - 1) / 2);
      return distance === 0 ? '#ddcfff' : `hsl(${282 + distance * 3}, 80%, ${91 - distance * 2}%)`;
    };
    const pegs = [];
    for (let row=0; row<16; row++) {
      const count = row % 2 ? 15 : 14, spacing = 72, start = (W-(count-1)*spacing)/2;
      for (let i=0;i<count;i++) pegs.push({x:start+i*spacing, y:190+row*75});
    }
    const momonga = new Image(); momonga.src = 'momonga.gif';
    const maxBalls = 100;
    let balls = [], score = 0, ballsLeft = maxBalls, animation, running = false, gameFinished = false;
    let leaderboard = JSON.parse(localStorage.getItem('goburinPlinkoLeaderboard') || '[]');
    const leaderboardEl = document.querySelector('#leaderboard');
    function updateControls() { ballsLeftEl.textContent = ballsLeft; dropButtons.forEach(button => button.disabled = ballsLeft === 0); }
    const escapeHTML = text => text.replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[character]);
    function renderLeaderboard() {
      leaderboardEl.innerHTML = leaderboard.length
        ? leaderboard.map(entry => `<li>${escapeHTML(entry.name)}<span>${entry.score}</span></li>`).join('')
        : '<li>Play to set a score!</li>';
    }
    function finishGame() {
      if (gameFinished) return;
      gameFinished = true;
      const qualifies = leaderboard.length < 10 || score > leaderboard[leaderboard.length - 1].score;
      if (qualifies) {
        const name = (prompt(`Great round! You scored ${score}. Enter your name for the top 10:`) || 'Player').trim().slice(0, 18) || 'Player';
        leaderboard.push({ name, score });
        leaderboard.sort((a, b) => b.score - a.score);
        leaderboard = leaderboard.slice(0, 10);
        localStorage.setItem('goburinPlinkoLeaderboard', JSON.stringify(leaderboard));
        renderLeaderboard();
      }
    }
    function rounded(x,y,w,h,r) { ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); ctx.stroke(); }
    function drawBoard() {
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#f1eaff'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#9c7fbb'; ctx.strokeStyle='#463452'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(18,H-100); ctx.stroke(); ctx.beginPath(); ctx.moveTo(W-18,0); ctx.lineTo(W-18,H-100); ctx.stroke();
      ctx.fillStyle='#ffffff'; ctx.font='900 21px ui-rounded, sans-serif'; ctx.textAlign='center'; ctx.fillText('DROP!',W/2,55);
      for (const p of pegs) { ctx.fillStyle='#fffbff'; ctx.beginPath(); ctx.arc(p.x,p.y,pegR,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle='#cba8ee'; ctx.beginPath(); ctx.arc(p.x-2,p.y-2,2,0,Math.PI*2); ctx.fill(); }
      const bw=(W-36)/bins.length;
      bins.forEach((value,i)=>{ ctx.fillStyle=binColor(i); rounded(18+i*bw,H-98,bw-3,80,8); ctx.fillStyle='#463452'; ctx.font='900 14px ui-rounded, sans-serif'; ctx.textAlign='center'; ctx.fillText(value,18+i*bw+(bw-3)/2,H-52); });
      ctx.strokeStyle='#463452'; ctx.lineWidth=3; for(let i=1;i<bins.length;i++){ ctx.beginPath();ctx.moveTo(18+i*bw,H-98);ctx.lineTo(18+i*bw,H-18);ctx.stroke(); }
    }
    function drawBall(ball) { ctx.save(); ctx.beginPath();ctx.arc(ball.x,ball.y,ballR,0,Math.PI*2);ctx.clip(); if(momonga.complete) ctx.drawImage(momonga,ball.x-ballR,ball.y-ballR,ballR*2,ballR*2); else {ctx.fillStyle='#eadfff';ctx.fill();} ctx.restore(); ctx.strokeStyle='#463452';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ball.x,ball.y,ballR,0,Math.PI*2);ctx.stroke(); }
    function render(){ drawBoard(); balls.forEach(drawBall); }
    function drop(count) {
      const amount = Math.min(count, ballsLeft);
      if (!amount) return;
      ballsLeft -= amount; updateControls();
      for (let i = 0; i < amount; i++) balls.push({x:W/2+(Math.random()-.5)*80,y:82,vx:(Math.random()-.5)*1.8,vy:0});
      if (!running) { running=true; tick(); }
    }
    function tick(){
      const landed = [];
      balls.forEach(ball => {
        // Half-speed motion: gravity and every frame's travel are reduced by 50%.
        ball.vy += .11; ball.x += ball.vx * .5; ball.y += ball.vy * .5; ball.vx *= .997;
        if(ball.x < 18+ballR || ball.x > W-18-ballR) { ball.vx *= -.72; ball.x=Math.max(18+ballR,Math.min(W-18-ballR,ball.x)); }
        for(const p of pegs) { const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy), min=ballR+pegR; if(d<min && d>0){ const nx=dx/d,ny=dy/d, push=min-d; ball.x+=nx*push;ball.y+=ny*push; const dot=ball.vx*nx+ball.vy*ny; if(dot<0){ball.vx-=1.35*dot*nx;ball.vy-=1.35*dot*ny;} ball.vx+=(Math.random()-.5)*.45; } }
        if(ball.y >= H-125) { const bin=Math.max(0,Math.min(bins.length-1,Math.floor((ball.x-18)/((W-36)/bins.length)))); score += bins[bin]; scoreEl.textContent=score; landed.push(ball); }
      });
      balls = balls.filter(ball => !landed.includes(ball));
      render();
      if (!balls.length) { running=false; if (!ballsLeft) finishGame(); return; }
      animation=requestAnimationFrame(tick);
    }
    dropButtons.forEach(button => button.addEventListener('click', () => drop(Number(button.dataset.drop))));
    document.querySelector('#reset').addEventListener('click',()=>{score=0;ballsLeft=maxBalls;gameFinished=false;scoreEl.textContent=0;balls=[];running=false;cancelAnimationFrame(animation);updateControls();render();});
    resetLeaderboardButton.addEventListener('click', () => {
      if (confirm('Reset the saved all-time top 10 scores? This cannot be undone.')) {
        leaderboard = [];
        localStorage.removeItem('goburinPlinkoLeaderboard');
        renderLeaderboard();
      }
    });
    momonga.onload=render; updateControls(); renderLeaderboard(); render();
  </script>
</body>
</html>
